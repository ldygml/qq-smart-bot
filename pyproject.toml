[project]
name = "qq-smart-bot"
version = "0.1.0"
description = "A configurable QQ AI chat bot using NapCat and OneBot v11"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "cryptography>=44,<47",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5.1,<7",
    "pypdfium2>=5,<6",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "psutil>=7,<8",
    "tzdata>=2025.2",
    "trafilatura>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
qq-smart-bot = "qq_ai_bot.__main__:main"
qq-control = "qq_ai_bot.control_plane:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_ai_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

