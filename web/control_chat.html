<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e120e">
  <title>给她爱 · 网页聊天</title>
  <link rel="stylesheet" href="/portal/control.css">
  <link rel="stylesheet" href="/portal/chat.css">
</head>
<body class="chat-page">
  <header class="topbar chat-topbar">
    <a class="brand" href="/portal"><span class="logo small">G</span><span><b>给她爱 · 网页聊天</b><small>WEB CONVERSATION</small></span></a>
    <div class="top-actions">
      <a href="/portal">控制台</a>
      <a id="chat-admin-link" target="_blank" rel="noreferrer" hidden>完整后台</a>
      <span id="chat-user-label"></span>
      <button id="chat-logout">退出</button>
    </div>
  </header>

  <main class="web-chat-layout">
    <aside class="chat-sidebar">
      <div>
        <p class="eyebrow">PRIVATE WEB CHAT</p>
        <h1>直接聊。</h1>
        <p class="chat-sidebar-copy">这里不是在模拟 QQ 消息，而是直接使用机器人当前的人格、模型、长期记忆和联网能力。聊天记录按实例保存在控制台，重启后仍然存在。</p>
      </div>

      <label class="chat-select-label">机器人实例
        <select id="chat-instance"></select>
      </label>
      <div id="chat-instance-state" class="chat-instance-state">正在读取实例…</div>

      <div class="chat-sidebar-actions">
        <button id="chat-reload" type="button">刷新记录</button>
        <button id="chat-clear" class="danger" type="button">清空网页记录</button>
      </div>

      <div class="chat-privacy-note">
        <b>独立会话</b>
        <span>每个机器人实例各有一份网页聊天记录；不会把消息发到 QQ，也不会冒充 QQ 联系人。</span>
      </div>
    </aside>

    <section class="chat-workspace" aria-label="网页聊天">
      <header class="chat-room-head">
        <div>
          <span class="chat-online-dot" id="chat-online-dot"></span>
          <strong id="chat-room-title">正在连接机器人</strong>
        </div>
        <span id="chat-room-meta">本地安全连接</span>
      </header>

      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite">
        <div class="chat-loading">正在读取聊天记录…</div>
      </div>

      <form id="chat-form" class="chat-composer">
        <div class="chat-compose-row">
          <textarea id="chat-input" rows="1" maxlength="20000" placeholder="说点什么…  Enter 发送，Shift+Enter 换行" aria-label="聊天消息"></textarea>
          <button id="chat-send" class="chat-send" type="submit">发送</button>
        </div>
        <div class="chat-compose-foot">
          <span id="chat-hint">连接后会直接回复，不写入 QQ 聊天。</span>
          <span id="chat-count">0 / 20000</span>
        </div>
        <p id="chat-error" class="chat-error" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="/portal/chat.js?v=20261119-webchat1"></script>
</body>
</html>
